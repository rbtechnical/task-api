name: CI Workflow

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          API_KEY: ${{ secrets.API_KEY }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/task-api:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task-api --all-tags

      - name: Verify pushed image runs
        run: |
         docker run -d -p 3000:3000 --name verify ${{ secrets.DOCKERHUB_USERNAME }}/task-api:${{ github.sha }}
         sleep 3
         curl -f http://localhost:3000/health
         docker stop verify


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull rbtechnical/task-api:latest
            docker stop task-api || true
            docker rm task-api || true
            docker run -d -p 3000:3000 -e API_KEY=vm-test-key --name task-api rbtechnical/task-api:latest